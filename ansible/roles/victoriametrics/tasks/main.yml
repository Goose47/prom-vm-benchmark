---
- name: Download VictoriaMetrics binary
  ansible.builtin.get_url:
    url: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.137.0/victoria-metrics-linux-amd64-v1.137.0.tar.gz
    dest: /tmp/victoriametrics.tar.gz

- name: Create VictoriaMetrics system group
  ansible.builtin.group:
    name: victoriametrics
    state: present

- name: Create VictoriaMetrics system user
  ansible.builtin.user:
    name: victoriametrics
    group: victoriametrics
    state: present
    shell: /sbin/nologin

- name: Unarchive VictoriaMetrics binary
  ansible.builtin.unarchive:
    src: /tmp/victoriametrics.tar.gz
    dest: /opt
    remote_src: true
    mode: 0744
    owner: victoriametrics
    group: victoriametrics

- name: Configure /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    block: |
      {% for n in range(victoriametrics_host_number) %}
      192.168.10.10 node-{{ n }}
      {% endfor %}
    insertafter: EOF

- name: Create the /etc/victoriametrics directory
  ansible.builtin.file:
    path: /etc/victoriametrics
    state: directory
    group: victoriametrics
    owner: victoriametrics

- name: Deploy victoriametrics.yml configuration file
  ansible.builtin.template:
    src: victoriametrics.yml.j2
    dest: /etc/victoriametrics/victoriametrics.yml
    owner: victoriametrics
    group: victoriametrics
    mode: 0644

- name: Template VictoriaMetrics systemd service
  ansible.builtin.template:
    src: templates/victoriametrics.service.j2
    dest: /etc/systemd/system/victoriametrics.service

- name: Create /victoria-metrics-data directory
  ansible.builtin.file:
    path: /victoria-metrics-data
    state: directory
    group: victoriametrics
    owner: victoriametrics

- name: Ensure VictoriaMetrics systemd service is enabled
  ansible.builtin.systemd_service:
    name: victoriametrics
    state: restarted
    enabled: true
    daemon_reload: true